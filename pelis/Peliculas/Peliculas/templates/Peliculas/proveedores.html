{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proveedores - Taller Mecánico</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <h2>⚙️ Taller<span>Panel</span></h2>
        <nav>
          <ul>
            <li><a href="{% url 'catalogo' %}">📦 Inventario</a></li>
            <li><a href="{% url 'ingresar_pelicula' %}">📥 Ingresar Repuesto</a></li>
            <li><a href="{% url 'alertas_stock' %}">⚠️ Alertas Stock</a></li>
            <li>
              <a href="{% url 'distribuidoras' %}" class="active">👥 Proveedores</a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <h1>Gestión de Proveedores</h1>
        </header>

        <div class="inventory-container">
          <div class="form-section">
            <h2 id="titulo-formulario">Registrar Proveedor</h2>
            <form id="form-proveedor">
              <input type="hidden" id="edit-index" value="-1" />

              <div class="form-group">
                <label for="empresa">Nombre de la Empresa</label>
                <input
                  type="text"
                  id="empresa"
                  required
                  placeholder="Ej: Repuestos Central S.A."
                />
              </div>

              <div class="form-group">
                <label for="rubro">Rubro Principal</label>
                <select id="rubro">
                  <option value="Frenos y Suspensión">Frenos y Suspensión</option>
                  <option value="Lubricantes y Químicos">Lubricantes y Químicos</option>
                  <option value="Componentes de Motor">Componentes de Motor</option>
                  <option value="Baterías y Eléctrica">Baterías y Eléctrica</option>
                </select>
              </div>

              <div class="form-group row">
                <div>
                  <label for="telefono">Teléfono</label>
                  <input
                    type="text"
                    id="telefono"
                    required
                    placeholder="+56 9 8765 4321"
                  />
                </div>
              </div>

              <button type="submit" id="btn-guardar" class="btn-add">
                Registrar Proveedor
              </button>

              <button
                type="button"
                id="btn-cancelar-edicion"
                class="btn-cancelar"
                style="display: none; width: 100%; margin-top: 10px"
              >
                ❌ Cancelar Edición
              </button>
            </form>
          </div>

          <div class="table-section" style="flex: 1.3">
            <h2>Lista de Contactos Comerciales</h2>
            <table class="inventory-table">
              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Rubro</th>
                  <th>Teléfono</th>
                  <th style="text-align: center">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpo-proveedores"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("form-proveedor");
        const cuerpoProveedores = document.getElementById("cuerpo-proveedores");
        const tituloFormulario = document.getElementById("titulo-formulario");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnCancelarEdicion = document.getElementById("btn-cancelar-edicion");
        const editIndexInput = document.getElementById("edit-index");

        // 1. Cargar y dibujar la lista de proveedores
        function cargarProveedores() {
          cuerpoProveedores.innerHTML = "";
          const lista = JSON.parse(localStorage.getItem("proveedores_taller")) || [];

          if (lista.length === 0) {
            cuerpoProveedores.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #718096; padding: 20px;">No hay proveedores registrados aún.</td></tr>`;
            return;
          }

          lista.forEach((prov, index) => {
            const fila = document.createElement("tr");
            fila.innerHTML = `
                <td><strong>${prov.empresa}</strong></td>
                <td>${prov.rubro}</td>
                <td style="color: var(--naranja-taller); font-weight: bold;">${prov.telefono}</td>
                <td style="text-align: center;">
                    <div style="display: flex; gap: 6px; justify-content: center;">
                        <button class="btn-editar-prov" data-index="${index}" style="background-color: #3182ce; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600;">✏️ Editar</button>
                        <button class="btn-eliminar-prov" data-index="${index}" style="background-color: var(--rojo-alerta); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600;">🗑️ Borrar</button>
                    </div>
                </td>
            `;
            cuerpoProveedores.appendChild(fila);
          });

          // Asignar eventos a los botones de Editar
          document.querySelectorAll(".btn-editar-prov").forEach((boton) => {
            boton.addEventListener("click", function () {
              prepararEdicion(this.getAttribute("data-index"));
            });
          });

          // Asignar eventos a los botones de Eliminar
          document.querySelectorAll(".btn-eliminar-prov").forEach((boton) => {
            boton.addEventListener("click", function () {
              eliminarProveedor(this.getAttribute("data-index"));
            });
          });
        }

        // 2. Pasar los datos de la tabla al formulario para editar
        function prepararEdicion(index) {
          const lista = JSON.parse(localStorage.getItem("proveedores_taller")) || [];
          const prov = lista[index];

          // Llenar los inputs existentes con los valores actuales
          document.getElementById("empresa").value = prov.empresa;
          document.getElementById("rubro").value = prov.rubro;
          document.getElementById("telefono").value = prov.telefono;

          // Cambiar el estado del formulario a Modo Edición
          editIndexInput.value = index;
          tituloFormulario.textContent = "✏️ Editar Proveedor";
          btnGuardar.textContent = "Guardar Cambios";
          btnGuardar.style.backgroundColor = "#3182ce"; 
          btnCancelarEdicion.style.display = "block";
        }

        // 3. Cancelar el modo edición y limpiar el formulario
        btnCancelarEdicion.addEventListener("click", resetearFormulario);

        function resetearFormulario() {
          form.reset();
          editIndexInput.value = "-1";
          tituloFormulario.textContent = "Registrar Proveedor";
          btnGuardar.textContent = "Registrar Proveedor";
          btnGuardar.style.backgroundColor = ""; 
          btnCancelarEdicion.style.display = "none";
        }

        // 4. Procesar el envío del formulario
        form.addEventListener("submit", function (e) {
          e.preventDefault();

          const index = parseInt(editIndexInput.value);
          const proveedorDatos = {
            empresa: document.getElementById("empresa").value,
            rubro: document.getElementById("rubro").value,
            telefono: document.getElementById("telefono").value,
          };

          let lista = JSON.parse(localStorage.getItem("proveedores_taller")) || [];

          if (index === -1) {
            // MODO REGISTRO
            lista.push(proveedorDatos);
          } else {
            // MODO EDICIÓN
            lista[index] = proveedorDatos;
          }

          localStorage.setItem("proveedores_taller", JSON.stringify(lista));
          resetearFormulario();
          cargarProveedores();
        });

        // 5. Eliminar un proveedor
        function eliminarProveedor(index) {
          if (confirm("¿Estás seguro de que deseas eliminar a este proveedor de la lista?")) {
            let lista = JSON.parse(localStorage.getItem("proveedores_taller")) || [];

            lista.splice(index, 1);
            localStorage.setItem("proveedores_taller", JSON.stringify(lista));

            if (parseInt(editIndexInput.value) === parseInt(index)) {
              resetearFormulario();
            }

            cargarProveedores();
          }
        }

        // Carga inicial
        cargarProveedores();
      });
    </script>
  </body>
</html>
